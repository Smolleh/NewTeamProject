
{% extends "base.html" %}
{% load static %}
{% block page_hero %}

    <h1>Create The Contributing Factors of the Failure</h1>
</div>
{% endblock %}
{%block content %}

<form id="create-factors-form" class="input-form">

    <textarea id="dataIssues" placeholder="dataIssues"></textarea>
    <textarea id="designChoices" placeholder="designChoices"></textarea>
    <textarea id="organisationalOrGovernanceIssues" placeholder="organisationalOrGovernanceIssues"></textarea>

    <div class="input-form">
        <button class="submit" type="submit">Save</button>

    </div>

</form>
<p id="message"></p>
<script>
    const exhibitId = "{{ exhibit.exhibitId }}";
</script>

<ul class="curator-navs">
    <li><a href="{% url 'curator_dashboard' %}"><img src="{% static 'images/arrow_back.png' %}"></a></li>
    <li><a href="{% url 'curator_dashboard' %}">Dashboard</a></li>
    <li><a href="{% url 'create_failure' exhibitId=exhibit.exhibitId %}"><img src="{% static 'images/arrow_forward.png' %}"></a></li>
</ul>


<script src="{% static 'js/create_factor.js' %}"></script>





{% endblock %}
