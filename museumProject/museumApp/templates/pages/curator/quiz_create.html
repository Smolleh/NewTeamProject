{% extends "base.html" %}
{% load static %}
{% block page_hero %}
<div class="page-hero">
    <h1>Create Quiz</h1>
</div>
{% endblock %}
{% block content %}

<form id="create-quiz-form" class="input-form">
<!-- creating a quiz-->
    <h2>Quiz Details</h2>
    <input id="quiz-name" type="text" placeholder="Quiz name" required>
    <input id="quiz-topic" type="text" placeholder="Topic" required>
    <input id="quiz-num-questions" type="number" placeholder="Number of questions to show per attempt" min="1" required>
    <input id="quiz-passing-score" type="number" placeholder="Passing score (%)" min="0" max="100" step="0.1" required> <!-- capping max parks-->
    <input id="quiz-max-points" type="number" placeholder="Max points awarded on pass" min="1" required>

    <label for="quiz-exhibit">Exhibit:</label>
    <select id="quiz-exhibit" required>
        <option value="">-- Select an exhibit --</option>
        <!-- selecting exhibit to link to -->
        {% for exhibit in exhibits %}
            <option value="{{ exhibit.exhibitId }}">{{ exhibit.title }}</option>
        {% endfor %}
    </select>

    <hr>
    <h2>Questions</h2>
    <div id="questions-container"></div>
    <button type="button" id="add-question-btn">+ Add Question</button>

    <hr>
    <button class="submit" type="submit">Save Quiz</button>
</form>

<p id="message"></p>

<ul class="curator-navs">
    <li><a href="{% url 'curator_dashboard' %}">&#8592; Dashboard</a></li>
</ul>

<script src="{% static 'js/create_quiz.js' %}"></script>

{% endblock %}
