
{% extends "base.html" %}
{%block content %}

    <div id="exhibit-content">
        <p>Loading exhibit...</p>
    </div>

    <script>
    const exhibitId = "{{ exhibitId }}";

    function getCookie(name) {
        return document.cookie.split('; ')
            .find(row => row.startsWith(name + '='))
            ?.split('=')[1];
    }

    function bookmarkExhibit(exhibitId) {
        fetch(`/exhibit/${exhibitId}/bookmark/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken'),
            },
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                alert('Bookmarked!');
            }
        });
    }

    fetch(`/api/exhibits/${exhibitId}`)
        .then(res => {
            if (!res.ok) throw new Error('Not found');
            return res.json();
        })
        .then(exhibit => {
            const artefactsHtml = exhibit.artefacts && exhibit.artefacts.length > 0
                ? `<ul class="exhibits-grid">
                    ${exhibit.artefacts.map(a => `
                        <li class="exhibit-card">
                            <h2>Artefact: ${a.artefactId}</h2>
                            <p>Information: ${a.info}</p>
                            <p>Date: ${a.artefactDate}</p>
                            ${a.artefactObjectPath ? `<img src="/media/${a.artefactObjectPath}">` : ''}
                        </li>`).join('')}
                   </ul>`
                : '<p>No supporting artifacts found.</p>';

            const aiHtml = exhibit.ai_system_description
                ? `<div class="ai_description">
                        <h2>AI System Used:</h2>
                        <h3>AI System Description:</h3>
                        <p>${exhibit.ai_system_description.systemDescription}</p>
                        <h3>AI System Purpose:</h3>
                        <p>${exhibit.ai_system_description.systemPurpose}</p>
                        <h3>AI System Outputs:</h3>
                        <p>${exhibit.ai_system_description.systemOutputs}</p>
                   </div>`
                : '<p>No information of AI system found.</p>';

            const factorsHtml = exhibit.contributing_factors
                ? `<div>
                        <h2>Contributing Factors to Failure:</h2>
                        <h3>Data Issues?:</h3>
                        <p>${exhibit.contributing_factors.dataIssues}</p>
                        <h3>Design Choices:</h3>
                        <p>${exhibit.contributing_factors.designChoices}</p>
                        <h3>Organisational or Governance Issues:</h3>
                        <p>${exhibit.contributing_factors.organisationalOrGovernanceIssues}</p>
                   </div>`
                : '<p>No information of contributing factors found.</p>';

            const failuresHtml = exhibit.failure_description
                ? `<div>
                        <h2>AI Failure Description:</h2>
                        <h3>What went wrong:</h3>
                        <p>${exhibit.failure_description.whatWentWrong}</p>
                        <h3>How the fault was detected:</h3>
                        <p>${exhibit.failure_description.howItWasDetected}</p>
                        <h3>What Was Affected:</h3>
                        <p>${exhibit.failure_description.whatWasAffected}</p>
                   </div>`
                : '<p>No information of AI failure found.</p>';

            const lessonsHtml = exhibit.lessons_learned
                ? `<div>
                        <h2>Lessons Learnt:</h2>
                        <h3>Practical Recommendations:</h3>
                        <p>${exhibit.lessons_learned.practicalRecommendations}</p>
                        <h3>Warnings to Future Users:</h3>
                        <p>${exhibit.lessons_learned.futureWarnings}</p>
                   </div>`
                : '<p>No information on lessons learnt found.</p>';

            document.getElementById('exhibit-content').innerHTML = `
                <h1>${exhibit.title}</h1>

                <section class="single-exhibit">
                    <h3>BookMark Button - use this to save an exhibit to your bookmarks page for easy access later</h3>
                    <button onclick="bookmarkExhibit(${exhibit.exhibitId})">Bookmark</button>
                </section>

                <section class="single-exhibit">
                    <h3>Description:</h3>
                    <p>${exhibit.domain}</p>
                    <h3>Background Deployment Context</h3>
                    <p>${exhibit.backgroundDeploymentContext}</p>
                    <h3>Intended Use:</h3>
                    <p>${exhibit.intededUse}</p>
                </section>

                <section class="single-exhibit">${artefactsHtml}</section>
                <section class="single-exhibit">${aiHtml}</section>
                <section class="single-exhibit">${factorsHtml}</section>
                <section class="single-exhibit">${failuresHtml}</section>
                <section class="single-exhibit">${lessonsHtml}</section>
            `;
        })
        .catch(() => {
            document.getElementById('exhibit-content').innerHTML = '<p>Failed to load exhibit.</p>';
        });
    </script>

{% endblock %}
