
{% extends "base.html" %}
{% block page_hero %}
<div class="page-hero">
    <h1 id="exhibit-hero-title">Register an Account</h1>
</div>
{% endblock %}
{%block content %}
<!-- uses django form for registering user, loads all fields required -->
<form method = "POST" action = "" class="input-form">
    {% csrf_token %}

    {{form.as_p}}

    <input type = "submit" value = "Sign Up">
    <p>Already registered? <a href="{% url 'login' %}">Login</a> here</p>
</form>



{% endblock %}
