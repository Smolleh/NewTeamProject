
{% extends "base.html" %}
{% block page_hero %}
<div class="page-hero">
    <h1>Exhibits</h1>
</div>
{% endblock %}
{%block content %}

    <section>
        <ul class="exhibits-grid" id="exhibits-grid">
            <li id="exhibits-loading"><p>Loading exhibits...</p></li>
        </ul>
    </section>

    <script>
    fetch('/api/exhibits/')
        .then(res => res.json())
        .then(exhibits => {
            const grid = document.getElementById('exhibits-grid');
            grid.innerHTML = '';
            if (exhibits.length === 0) {
                grid.innerHTML = '<p>No exhibits found.</p>';
                return;
            }
            exhibits.forEach(exhibit => {
                const li = document.createElement('li');
                li.className = 'exhibit-card';
                li.innerHTML = `
                    <a href="/exhibit/${exhibit.exhibitId}/">
                        <h2>${exhibit.title}</h2>
                        <p>${exhibit.domain}</p>
                    </a>
                `;
                grid.appendChild(li);
            });
        })
        .catch(() => {
            document.getElementById('exhibits-grid').innerHTML = '<p>Failed to load exhibits.</p>';
        });
    </script>

{% endblock %}
